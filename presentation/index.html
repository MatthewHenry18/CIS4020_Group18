<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diabetes and Healthy Living | CIS*4020</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: #f0efec;
    --blue: #2a78d6; --orange: #eb6834; --aqua: #1baf7a; --yellow: #eda100; --magenta: #e87ba4;
    --green: #008300; --red: #e34948; --violet: #6250d6;
    --pos: var(--orange);   /* adults with a diagnosis */
    --neg: var(--blue);     /* adults without a diagnosis */
    --up: var(--red);       /* pushes toward a diagnosis */
    --down: var(--blue);    /* pushes away from a diagnosis */
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e9e8e3; color: var(--ink); overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0;
           background: var(--surface); box-shadow: 0 2px 24px rgba(0,0,0,.08); overflow: hidden; }
  .slide { position: absolute; inset: 0; padding: 48px 64px 64px; display: none; flex-direction: column; }
  .slide.active { display: flex; }
  .kicker { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  h1 { font-size: 40px; font-weight: 650; margin: 0 0 20px; letter-spacing: -0.01em; line-height: 1.15; }
  h2 { font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  p, li { font-size: 21px; line-height: 1.45; color: var(--ink-2); margin: 0 0 10px; }
  ul { margin: 0; padding-left: 24px; }
  li { margin-bottom: 8px; }
  b, strong { color: var(--ink); font-weight: 600; }
  .row { display: flex; gap: 40px; flex: 1; min-height: 0; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .small { font-size: 15px; color: var(--muted); line-height: 1.4; }
  .note { font-size: 16px; color: var(--ink-2); line-height: 1.45; }
  .tiles { display: flex; gap: 16px; margin-bottom: 18px; }
  .tile { flex: 1; border: 1px solid var(--ring); border-radius: 10px; padding: 14px 18px; background: #fff; }
  .tile .label { font-size: 15px; color: var(--ink-2); }
  .tile .value { font-size: 36px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
  .tile .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .card { border: 1px solid var(--ring); border-radius: 10px; padding: 18px 22px; background: #fff; }
  .card h2 { font-size: 20px; }
  .card p { font-size: 18px; }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--wash); color: var(--ink-2); margin-left: 6px; vertical-align: 3px; }
  table.t { border-collapse: collapse; width: 100%; font-size: 17px; }
  table.t th { text-align: left; font-weight: 600; color: var(--muted); font-size: 14px; padding: 6px 10px; border-bottom: 1px solid var(--axis); }
  table.t td { padding: 8px 10px; border-bottom: 1px solid var(--grid); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  table.t td.num, table.t th.num { text-align: right; }
  table.t tr.win td { color: var(--ink); font-weight: 600; background: #f3f7fd; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 15px; color: var(--ink-2); margin: 4px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .swl { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; font-size: 15px; border: 0; background: #fff; padding: 7px 14px; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--axis); }
  .seg button.on { background: var(--ink); color: #fff; }
  button.btn { font: inherit; font-size: 15px; border: 1px solid var(--axis); background: #fff; border-radius: 8px; padding: 7px 12px; color: var(--ink); cursor: pointer; }
  button.btn:hover, .seg button:not(.on):hover { background: var(--wash); }
  .controls { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=range] { width: 360px; accent-color: var(--ink); }
  svg text { font-family: inherit; }
  .axis text { fill: var(--muted); font-size: 13px; }
  .axis line, .axis path { stroke: var(--axis); }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  [data-tip] { cursor: default; }
  #tip { position: fixed; pointer-events: none; z-index: 10; background: #fff; border: 1px solid var(--ring);
         box-shadow: 0 4px 16px rgba(0,0,0,.10); border-radius: 8px; padding: 8px 11px; font-size: 14px;
         line-height: 1.4; color: var(--ink-2); max-width: 300px; display: none; }
  #tip b { color: var(--ink); }
  footer { position: absolute; left: 64px; right: 64px; bottom: 18px; display: flex; justify-content: space-between;
           font-size: 13px; color: var(--muted); }
  #progress { position: absolute; left: 0; top: 0; height: 4px; background: var(--ink); transition: width .25s; }
  #navhint { position: fixed; top: 10px; right: 14px; font-size: 12px; color: #8a8984; }
  /* matrix */
  .cm { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 6px; font-size: 15px; }
  .cm div { padding: 10px 12px; border-radius: 8px; }
  .cm .h { color: var(--muted); font-size: 14px; display: flex; align-items: flex-end; }
  .cm .rh { color: var(--muted); font-size: 14px; display: flex; align-items: center; }
  .cm .c { background: #fff; border: 1px solid var(--ring); }
  .cm .c .n { font-size: 30px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cm .c.good { box-shadow: inset 4px 0 0 var(--ink); }
  .bigstat { font-size: 15px; color: var(--ink-2); }
  .bigstat .v { font-size: 34px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  /* live call */
  .qgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; }
  .q { min-width: 0; }
  .q label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q select, .q input { width: 100%; font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid var(--axis); border-radius: 6px; background: #fff; color: var(--ink); }
  .q.changed select, .q.changed input { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; padding: 6px 14px; border-radius: 99px; }
  .pill.on { background: var(--ink); color: #fff; }
  .pill.off { background: var(--wash); color: var(--ink-2); }
  .meter { position: relative; height: 14px; border-radius: 7px; background: var(--wash); margin: 8px 0 34px; }
  .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--ink); transition: width .2s; }
  .meter .mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--muted); }
  .meter .marklab { position: absolute; top: 18px; font-size: 12px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
  .chip { display: inline-block; font-size: 15px; padding: 5px 12px; border-radius: 99px; background: #fff; border: 1px solid var(--axis); color: var(--ink-2); margin: 0 6px 6px 0; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .flow { display: flex; align-items: stretch; margin-top: 14px; }
  .flow .step { flex: 1; border: 1px solid var(--ring); border-radius: 10px; background: #fff; padding: 10px 14px; }
  .flow .step b { display: block; font-size: 16px; margin-bottom: 2px; }
  .flow .step span { font-size: 14px; color: var(--ink-2); line-height: 1.35; }
  .flow .step i { font-style: normal; display: inline-flex; width: 20px; height: 20px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 12px; align-items: center; justify-content: center; margin-right: 6px; vertical-align: 1px; }
  .flow .arrow { flex: 0 0 30px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; }
  .card.sm { padding: 11px 16px; }
  table.mini { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
  table.mini th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 3px 8px; border-bottom: 1px solid var(--axis); }
  table.mini td { padding: 4px 8px; color: var(--ink-2); border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  .card.sm h2 { font-size: 17px; margin: 0 0 3px; }
  .card.sm p { font-size: 15.5px; margin: 0; line-height: 1.4; }
  .cm .c.ok { background: #eef7ef; border-color: #b9dcbc; }
  .cm .c.err { background: #fdf0ef; border-color: #f0c2c1; }
  .cm .c .ic { font-weight: 700; margin-right: 4px; }
  .cm .c.ok .ic { color: var(--green); }
  .cm .c.err .ic { color: var(--red); }
  .lim { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .lim .card { display: flex; gap: 14px; align-items: flex-start; padding: 12px 16px; }
  .lim .card svg { flex: 0 0 34px; }
  .lim .card h2 { font-size: 17px; margin: 0 0 2px; }
  .lim .card p { font-size: 15px; margin: 0; line-height: 1.4; }
  .lim .grp { grid-column: 1 / -1; font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .icard { border: 1px solid var(--ring); border-radius: 14px; background: #fff; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
           transition: transform .2s ease, box-shadow .2s ease; }
  .icard:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.07); }
  .icard h2 { font-size: 19px; margin: 0; }
  .claims.big .icard { padding: 28px 24px; gap: 14px; }
  .claims.big .icard h2 { font-size: 23px; }
  .claims.big .icard p { font-size: 19px; }
  .claims.big .ibadge { width: 62px; height: 62px; }
  .icard p { font-size: 16.5px; margin: 0; line-height: 1.45; }
  .ibadge { width: 50px; height: 50px; border-radius: 14px; background: var(--wash); display: flex; align-items: center; justify-content: center; flex: none; }
  .ibadge.dark { background: var(--ink); }
  .irow { display: flex; gap: 14px; align-items: flex-start; }
  .nbadge { display: inline-flex; width: 26px; height: 26px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; align-items: center; justify-content: center; }
  .banner { background: var(--ink); color: #fff; border-radius: 14px; padding: 18px 24px; }
  .banner .small { color: #b9b8b1; }
  .banner p { color: #fff; }
  .pill-s { display: inline-block; font-size: 12.5px; padding: 3px 9px; border-radius: 99px; background: var(--wash); color: var(--ink-2); margin: 0 4px 5px 0; font-family: ui-monospace, Consolas, monospace; }
  .avatar { width: 64px; height: 64px; border-radius: 99px; background: var(--ink); color: #fff; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
  .tile .ibadge { width: 40px; height: 40px; border-radius: 11px; float: right; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes growY { from { transform: scaleY(0); } }
  @keyframes growX { from { transform: scaleX(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes arc { from { stroke-dashoffset: var(--arc); } }
  @media (prefers-reduced-motion: no-preference) {
    .slide.active > * { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
    .slide.active > *:nth-child(2) { animation-delay: .05s; }
    .slide.active > *:nth-child(3) { animation-delay: .10s; }
    .slide.active > *:nth-child(4) { animation-delay: .15s; }
    .slide.active > *:nth-child(5) { animation-delay: .20s; }
    .slide.active > *:nth-child(6) { animation-delay: .25s; }
    .slide.active > *:nth-child(n+7) { animation-delay: .30s; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > * { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > *:nth-child(1) { animation-delay: .15s; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > *:nth-child(2) { animation-delay: .23s; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > *:nth-child(3) { animation-delay: .31s; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > *:nth-child(4) { animation-delay: .39s; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > *:nth-child(5) { animation-delay: .47s; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > *:nth-child(6) { animation-delay: .55s; }
    .slide.active :is(.stagger, .tiles, .claims, .lim, .flow) > *:nth-child(n+7) { animation-delay: .63s; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: growY .7s cubic-bezier(.2,.7,.2,1) both; }
    .barR { transform-box: fill-box; transform-origin: 0 50%; animation: growX .7s cubic-bezier(.2,.7,.2,1) both; }
    .barL { transform-box: fill-box; transform-origin: 100% 50%; animation: growX .7s cubic-bezier(.2,.7,.2,1) both; }
    .draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out forwards; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; }
    .fade { animation: fadein .9s ease both; }
    .rowin { animation: rise .35s ease both; }
    .arcv { animation: arc 1.4s .9s cubic-bezier(.2,.7,.2,1) both; }
  }
  @keyframes flow { to { stroke-dashoffset: -36; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .claims { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
  .divider h1 { font-size: 52px; }
  .title-slide h1 { font-size: 60px; margin-bottom: 14px; }
</style>

<script src="data.js"></script>

<script>
"use strict";
// If anything goes wrong while building the slides, say so on screen instead of showing a blank page
window.addEventListener("error", (e) => {
  fit2();
  document.getElementById("slides").innerHTML = `<section class="slide active"><div class="kicker">Something went wrong</div>
    <h1>The slides couldn't load</h1><p>Most likely <code>data.js</code> is out of date or missing. Re-run the last cell of
    DataScienceGroupAssignment.ipynb (<code>%run -i export_presentation_data.py</code>), keep index.html, data.js and model.js
    in the same folder, then refresh.</p><p class="small">Details: ${String(e.message).replace(/</g, "&lt;")}</p></section>`;
});
fit2();
const D = window.DATA, M = window.DiabetesModel;

// ------------------------------------------------------------------ formatting helpers
const pct = (x, d = 0) => (100 * x).toFixed(d) + "%";
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const f2 = (x) => x.toFixed(2), f3 = (x) => x.toFixed(3);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

const MODEL_NAMES = { baseline: "Majority-class dummy", log_reg: "Logistic regression", decision_tree: "Decision tree",
  random_forest: "Random forest", naive_bayes: "Naive Bayes", neural_net: "Neural net (MLP)", grad_boost: "Gradient boosting" };
const MODEL_WHY = { log_reg: "Odds ratios show what raises or lowers risk", decision_tree: "Readable yes/no rules",
  random_forest: "Many trees averaged, more stable", naive_bayes: "Simple probability baseline",
  neural_net: "Model class in Xie et al. (2019)", grad_boost: "Usually strongest on tables; explained with SHAP" };
const MODEL_COLOR = { log_reg: "var(--orange)", decision_tree: "var(--aqua)", random_forest: "var(--yellow)",
  naive_bayes: "var(--magenta)", neural_net: "var(--green)", grad_boost: "var(--blue)" };

const AGE = ["18-24","25-29","30-34","35-39","40-44","45-49","50-54","55-59","60-64","65-69","70-74","75-79","80+"];
const INCOME = ["<$10k","$10-15k","$15-20k","$20-25k","$25-35k","$35-50k","$50-75k","$75k+"];
const EDU = ["Never / kindergarten","Grades 1-8","Grades 9-11","Grade 12 / GED","Some college","College graduate"];
const GEN = ["Excellent","Very good","Good","Fair","Poor"];
const BMI_LABEL = { underweight: "Under&shy;weight", normal: "Normal", overweight: "Over&shy;weight",
  obese_I: "Obese I", obese_II: "Obese II", obese_III: "Obese III" };
const BMI_PLAIN = { underweight: "Underweight", normal: "Normal", overweight: "Overweight",
  obese_I: "Obese I", obese_II: "Obese II", obese_III: "Obese III" };

// Every survey answer: chart label and how to ask / show it in the live call
const YN = [["No", 0], ["Yes", 1]];
const Q = {
  GenHlth: { label: "General health", ask: "General health", opts: GEN.map((g, i) => [g, i + 1]) },
  BMI: { label: "BMI", ask: "BMI", num: [12, 98] },
  Age: { label: "Age", ask: "Age group", opts: AGE.map((a, i) => [a, i + 1]) },
  HighBP: { label: "High blood pressure", ask: "High blood pressure", opts: YN },
  HighChol: { label: "High cholesterol", ask: "High cholesterol", opts: YN },
  CholCheck: { label: "Cholesterol check (5 yr)", ask: "Cholesterol check in 5 years", opts: YN },
  Sex: { label: "Sex", ask: "Sex", opts: [["Female", 0], ["Male", 1]] },
  HeartDiseaseorAttack: { label: "Heart disease / attack", ask: "Heart disease or attack", opts: YN },
  DiffWalk: { label: "Difficulty walking", ask: "Difficulty walking / stairs", opts: YN },
  Stroke: { label: "Stroke", ask: "Ever had a stroke", opts: YN },
  AnyHealthcare: { label: "Health coverage", ask: "Has health coverage", opts: YN },
  NoDocbcCost: { label: "Skipped doctor (cost)", ask: "Skipped doctor due to cost", opts: YN },
  Smoker: { label: "Smoker (100+ cigarettes)", ask: "Smoked 100+ cigarettes", opts: YN },
  Veggies: { label: "Vegetables daily", ask: "Vegetables daily", opts: YN },
  PhysActivity: { label: "Physical activity", ask: "Exercise in past 30 days", opts: YN },
  MentHlth: { label: "Poor mental-health days", ask: "Poor mental-health days (0-30)", num: [0, 30] },
  Fruits: { label: "Fruit daily", ask: "Fruit daily", opts: YN },
  Education: { label: "Education", ask: "Education", opts: EDU.map((e, i) => [e, i + 1]) },
  PhysHlth: { label: "Poor physical-health days", ask: "Poor physical-health days (0-30)", num: [0, 30] },
  Income: { label: "Income", ask: "Household income", opts: INCOME.map((x, i) => [x, i + 1]) },
  HvyAlcoholConsump: { label: "Heavy drinking", ask: "Heavy drinker", opts: YN },
};
const qLabel = (f) => (Q[f] ? Q[f].label : f);
const LIFESTYLE = ["PhysActivity", "Smoker", "Fruits", "Veggies", "HvyAlcoholConsump"];

// ------------------------------------------------------------------ icons (simple line drawings, 34x34)
const ICO = {
  dollar: '<circle cx="17" cy="17" r="13"/><path d="M21 12.5c-1-1.4-2.5-2-4-2-2.2 0-4 1.2-4 3s1.8 2.5 4 3 4 1.2 4 3-1.8 3-4 3c-1.6 0-3.2-.6-4.2-2M17 7.5v19"/>',
  pulse: '<path d="M3 18h6l3-7 5 14 4-10 3 3h7"/>',
  refresh: '<path d="M27 13a11 11 0 1 0 1 8"/><path d="M28 5v8h-8"/>',
  target: '<circle cx="17" cy="17" r="13"/><circle cx="17" cy="17" r="8"/><circle cx="17" cy="17" r="3"/>',
  dice: '<rect x="5" y="5" width="24" height="24" rx="5"/><circle cx="11.5" cy="11.5" r="1.8" fill="currentColor"/><circle cx="17" cy="17" r="1.8" fill="currentColor"/><circle cx="22.5" cy="22.5" r="1.8" fill="currentColor"/>',
  book: '<path d="M17 9c-3-2-7-3-12-3v20c5 0 9 1 12 3 3-2 7-3 12-3V6c-5 0-9 1-12 3zM17 9v20"/>',
  search: '<circle cx="15" cy="15" r="9"/><path d="M22 22l7 7"/>',
  leaf: '<path d="M7 27C7 15 15 7 28 6c0 13-8 21-21 21z"/><path d="M7 27l11-11"/>',
  layers: '<path d="M17 5l12 6-12 6-12-6z"/><path d="M5 17l12 6 12-6"/><path d="M5 23l12 6 12-6"/>',
  users: '<circle cx="13" cy="12" r="5"/><path d="M4 28c1-6 5-9 9-9s8 3 9 9"/><path d="M22 7a5 5 0 0 1 0 10M25 19c3 1 5 4 5 9"/>',
  check: '<rect x="5" y="5" width="24" height="24" rx="5"/><path d="M11 17l4 4 8-9"/>',
  blank: '<rect x="5" y="5" width="24" height="24" rx="5" stroke-dasharray="3 3"/>',
  hash: '<path d="M13 5l-3 24M24 5l-3 24M6 12h23M5 22h23"/>',

function runCounts(root) {

  root.querySelectorAll(".count").forEach((el) => {

// ------------------------------------------------------------------ small SVG chart kit
function niceTicks(max, n = 5) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const out = []; for (let v = 0; v < max + step - 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
function roundedTopBar(x, y, w, h, r = 4) {
  if (h <= 0) return "";
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function roundedRightBar(x, y, w, h, r = 4) {   // horizontal bar, rounded at the data end (right)
  if (w <= 0) return "";
  r = Math.min(r, w, h / 2);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
function roundedLeftBar(x, y, w, h, r = 4) {    // horizontal bar growing left from x
  if (w <= 0) return "";
  r = Math.min(r, w, h / 2);
  return `M${x},${y}H${x - w + r}Q${x - w},${y} ${x - w},${y + r}V${y + h - r}Q${x - w},${y + h} ${x - w + r},${y + h}H${x}Z`;
}

// Grouped column chart. series: [{name, color, values}], tip(ci, si) -> html, label(ci, si) -> text or ""
function columns(el, { cats, series, w, h, yMax, yFmt, tip, label, catLabel, ml = 52, mb = 46, barW = 24 }) {
  const mt = 18, mr = 10, iw = w - ml - mr, ih = h - mt - mb;
  yMax = yMax || Math.max(...series.flatMap((s) => s.values)) * 1.12;
  const ticks = niceTicks(yMax, 4), top = ticks[ticks.length - 1];
  const y = (v) => mt + ih - (v / top) * ih;
  const band = iw / cats.length, n = series.length, gap = 2;
  const bw = Math.min(barW, (band * 0.7 - gap * (n - 1)) / n);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  ticks.forEach((t) => {
    s += `<line class="gridline" x1="${ml}" x2="${w - mr}" y1="${y(t)}" y2="${y(t)}"/>`;
    s += `<text x="${ml - 8}" y="${y(t) + 4}" text-anchor="end" fill="var(--muted)" font-size="13">${yFmt(t)}</text>`;
  });
  cats.forEach((c, ci) => {
    const x0 = ml + ci * band + (band - (n * bw + (n - 1) * gap)) / 2;
    series.forEach((se, si) => {
      const v = se.values[ci], x = x0 + si * (bw + gap);
      s += `<path class="bar" style="animation-delay:${ci * 35 + si * 20}ms" d="${roundedTopBar(x, y(v), bw, mt + ih - y(v))}" fill="${se.color}"/>`;
      const lab = label ? label(ci, si) : "";
      if (lab) s += `<text x="${x + bw / 2}" y="${y(v) - 6}" text-anchor="middle" font-size="13" fill="var(--ink-2)">${lab}</text>`;
    });
    // hover target: the whole band
    s += `<rect x="${ml + ci * band}" y="${mt}" width="${band}" height="${ih}" fill="transparent" data-tip="${esc(tip(ci))}"/>`;
    s += `<text x="${ml + ci * band + band / 2}" y="${h - mb + 20}" text-anchor="middle" font-size="13" fill="var(--muted)">${catLabel ? catLabel(c) : c}</text>`;
  });
  s += `<line x1="${ml}" x2="${w - mr}" y1="${mt + ih}" y2="${mt + ih}" stroke="var(--axis)"/>`;
  el.innerHTML = s + "</svg>";
}

// Line chart on [0,1] x [0,1] (ROC, calibration)
function unitLines(el, { lines, w, h, xLabel, yLabel, diag = true, xMax = 1, yMax = 1 }) {
  const ml = 56, mb = 48, mt = 12, mr = 14, iw = w - ml - mr, ih = h - mt - mb;
  const X = (v) => ml + (v / xMax) * iw, Y = (v) => mt + ih - (v / yMax) * ih;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  const tx = niceTicks(xMax, 5), ty = niceTicks(yMax, 5);
  ty.forEach((t) => { s += `<line class="gridline" x1="${ml}" x2="${w - mr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${ml - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="13" fill="var(--muted)">${pct(t)}</text>`; });
  tx.forEach((t) => { s += `<text x="${X(t)}" y="${mt + ih + 20}" text-anchor="middle" font-size="13" fill="var(--muted)">${pct(t)}</text>`; });
  s += `<line x1="${ml}" x2="${w - mr}" y1="${mt + ih}" y2="${mt + ih}" stroke="var(--axis)"/>`;
  if (diag) s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(Math.min(xMax, yMax))}" y2="${Y(Math.min(xMax, yMax))}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>`;
  s += `<text x="${ml + iw / 2}" y="${h - 6}" text-anchor="middle" font-size="14" fill="var(--ink-2)">${xLabel}</text>`;
  s += `<text transform="translate(14 ${mt + ih / 2}) rotate(-90)" text-anchor="middle" font-size="14" fill="var(--ink-2)">${yLabel}</text>`;
  lines.forEach((L) => {
    const op = L.dim ? 0.18 : 1;
    s += `<path d="${L.x.map((v, i) => (i ? "L" : "M") + X(v).toFixed(1) + "," + Y(L.y[i]).toFixed(1)).join("")}" fill="none" stroke="${L.color}" stroke-width="${L.bold ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round" opacity="${op}" pathLength="1" class="draw"/>`;
    if (L.markers) L.x.forEach((v, i) => {
      s += `<circle class="pop" style="animation-delay:${0.5 + i * 0.05}s" cx="${X(v)}" cy="${Y(L.y[i])}" r="5" fill="${L.color}" stroke="var(--surface)" stroke-width="2" opacity="${op}"/>`;
      s += `<circle cx="${X(v)}" cy="${Y(L.y[i])}" r="12" fill="transparent" data-tip="${esc(L.tip(i))}"/>`;
    });
  });
  el.innerHTML = s + "</svg>";
}

function confusion(k) {
  let tp = 0, fn = 0, fp = 0, tn = 0;
  for (let i = 0; i < C.pos.length; i++) { if (i >= k) { tp += C.pos[i]; fp += C.neg[i]; } else { fn += C.pos[i]; tn += C.neg[i]; } }

  return { tp, fn, fp, tn, rec, prec, f1, fpr: fp / (fp + tn), flagged: (tp + fp) / (tp + fp + fn + tn) };
}

  layers.slice(1, 3).forEach((L, li) => L.forEach(([x, y], i) => { s += `<circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="var(--ink)" stroke-width="1.5" style="animation:pulse ${1.6 + ((i + li) % 3) * 0.4}s ease-in-out infinite"/>`; }));

  s += `<circle cx="575" cy="215" r="30" fill="var(--ink)"/><text x="575" y="221" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">risk</text>`;
  el.innerHTML = s + "</svg>";
}

add("Evaluation", `
  <div class="kicker">Evaluation · try it</div><h1>Where do we draw the line?</h1>
  <div class="controls">
    <span class="bigstat">Cut-off on the model's score: <b id="thr-v" style="font-size:22px"></b></span>
    <input type="range" id="thr" min="${kOf(0.05)}" max="${kOf(0.95)}" step="1">
    <button class="btn" id="thr-tuned">Our tuned cut-off (${f2(C.tuned)})</button>
    <button class="btn" id="thr-half">Default 0.50</button>
  </div>
  <div class="row" style="gap:32px">
    <div class="col" style="max-width:560px">
      <div class="legend"><span><i class="sw" style="background:var(--neg)"></i>No diabetes</span><span><i class="sw" style="background:var(--pos)"></i>Has diabetes</span><span><i class="sw" style="background:var(--wash);border:1px solid var(--axis)"></i>Flagged</span></div>
      <div id="c-dist"></div>
    </div>
    <div class="col">
      <div class="cm" id="cm"></div>
      <div style="display:flex;gap:24px;margin-top:16px;align-items:flex-end" id="cm-stats"></div>
      <p class="note" id="cm-story" style="margin-top:12px"></p>
    </div>
  </div>`, () => {
  const slider = document.getElementById("thr");
  slider.value = state.k;
  // Aggregate the 0.001-wide bins into 0.025-wide bins for the picture
  const G = 25, nb = Math.ceil(C.pos.length / G), P = [], N = [], X = [];
  const totP = C.pos.reduce((a, b) => a + b, 0), totN = C.neg.reduce((a, b) => a + b, 0);
  for (let g = 0; g < nb; g++) {
    let p = 0, n = 0; for (let i = g * G; i < Math.min((g + 1) * G, C.pos.length); i++) { p += C.pos[i]; n += C.neg[i]; }
    P.push(p / totP); N.push(n / totN); X.push(thrOf(g * G));
  }
  const W = 540, H = 330, ml = 48, mb = 40, mt = 10, mr = 18, iw = W - ml - mr, ih = H - mt - mb;
  const ymax = Math.max(...P, ...N) * 1.1;
  const xs = (v) => ml + Math.max(0, Math.min(1, v)) * iw, ys = (v) => mt + ih - (v / ymax) * ih;
  const step = (arr) => arr.map((v, g) => `${g ? "L" : "M"}${xs(X[g]).toFixed(1)},${ys(v).toFixed(1)}H${xs(X[g] + G * C.step).toFixed(1)}`).join("");
  const render = () => {
    const k = state.k, t = thrOf(k), m = confusion(k);
    document.getElementById("thr-v").textContent = f3(t);
    let s = `<svg width="${W}" height="${H}">`;
    s += `<rect x="${xs(t)}" y="${mt}" width="${xs(1) - xs(t)}" height="${ih}" fill="var(--wash)"/>`;
    niceTicks(ymax, 4).filter((v) => v <= ymax).forEach((v) => { s += `<line class="gridline" x1="${ml}" x2="${W - mr}" y1="${ys(v)}" y2="${ys(v)}"/><text x="${ml - 8}" y="${ys(v) + 4}" font-size="13" text-anchor="end" fill="var(--muted)">${pct(v)}</text>`; });
    [0, 0.25, 0.5, 0.75, 1].forEach((v) => { s += `<text x="${xs(v)}" y="${mt + ih + 18}" font-size="13" text-anchor="middle" fill="var(--muted)">${v.toFixed(2)}</text>`; });
    s += `<text x="${ml + iw / 2}" y="${H - 4}" font-size="14" text-anchor="middle" fill="var(--ink-2)">model score</text>`;
    s += `<path d="${step(N)}V${ys(0)}H${xs(X[0])}Z" fill="var(--neg)" opacity="0.10"/><path d="${step(N)}" fill="none" stroke="var(--neg)" stroke-width="2"/>`;
    s += `<path d="${step(P)}V${ys(0)}H${xs(X[0])}Z" fill="var(--pos)" opacity="0.10"/><path d="${step(P)}" fill="none" stroke="var(--pos)" stroke-width="2"/>`;
    s += `<line x1="${xs(t)}" x2="${xs(t)}" y1="${mt}" y2="${mt + ih}" stroke="var(--ink)" stroke-width="2"/>`;
    s += `<text x="${xs(t) + 6}" y="${mt + 14}" font-size="13" fill="var(--ink)">flag →</text>`;
    X.forEach((x0, g) => { s += `<rect x="${xs(x0)}" y="${mt}" width="${xs(x0 + G * C.step) - xs(x0)}" height="${ih}" fill="transparent" data-tip="${esc(`<b>Score ${x0.toFixed(3)}–${(x0 + G * C.step).toFixed(3)}</b><br>No diabetes: ${pct(N[g], 1)} of the group<br>Has diabetes: ${pct(P[g], 1)} of the group`)}"/>`; });
    s += `<line x1="${ml}" x2="${W - mr}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--axis)"/></svg>`;
    document.getElementById("c-dist").innerHTML = s;
    document.getElementById("cm").innerHTML = `
      <div class="h"></div><div class="h">Flagged for a test</div><div class="h">Not flagged</div>
      <div class="rh">Has diabetes</div><div class="c ok"><div class="n">${fmt(m.tp)}</div><span class="ic">✓</span>caught</div><div class="c err"><div class="n">${fmt(m.fn)}</div><span class="ic">✗</span>missed</div>
      <div class="rh">No diabetes</div><div class="c err"><div class="n">${fmt(m.fp)}</div><span class="ic">✗</span>false alarm</div><div class="c ok"><div class="n">${fmt(m.tn)}</div><span class="ic">✓</span>correctly cleared</div>`;
    document.getElementById("cm-stats").innerHTML = [["Caught (recall)", pct(m.rec)], ["Flags correct (precision)", pct(m.prec)], ["F1", f3(m.f1)], ["Adults flagged", pct(m.flagged)]]
      .map(([a, b]) => `<div class="bigstat">${a}<div class="v">${b}</div></div>`).join("");
    document.getElementById("cm-story").innerHTML = k === C.k_tuned ? `<span class="tag" style="margin:0">our tuned cut-off</span>` : "";
  };
  slider.oninput = () => { state.k = +slider.value; render(); };
  document.getElementById("thr-tuned").onclick = () => { state.k = C.k_tuned; slider.value = state.k; render(); };
  document.getElementById("thr-half").onclick = () => { state.k = kOf(0.5); slider.value = state.k; render(); };
  render();
});

add("Evaluation", `
  <div class="kicker">Error analysis</div><h1>Who does the model get wrong?</h1>
  <div class="controls"><div class="seg" id="grp-seg"></div></div>
  <div class="legend"><span><i class="sw" style="background:var(--pos)"></i>Missed: has diabetes, not flagged</span><span><i class="sw" style="background:var(--neg)"></i>False alarm: no diabetes, flagged</span></div>

    <div class="col"><div id="c-grp"></div></div>
    <div class="col" style="flex:none;width:290px">

      <div class="card sm"><h2>More false alarms</h2><p>Older, lower-income and heavier adults</p></div>
    </div>
  </div>`, () => {
  const groups = [["Age", "Age"], ["Income", "Income"], ["Sex", "Sex"], ["bmi_category", "BMI group"]];
  if (!state.grp) state.grp = "Age";
  const seg = document.getElementById("grp-seg");
  seg.innerHTML = groups.map(([k, l]) => `<button data-g="${k}" class="${k === state.grp ? "on" : ""}">${l}</button>`).join("");
  seg.querySelectorAll("button").forEach((b) => (b.onclick = () => { state.grp = b.dataset.g; slides[cur].draw(); }));
  const G = D.subgroups[state.grp];
  const k = Math.round((thrOf(state.k) - G.lo) / G.step);   // follows the cut-off slider, to the nearest 0.01
  const lab = (lv) => state.grp === "Age" ? AGE[lv - 1] : state.grp === "Income" ? INCOME[lv - 1] : state.grp === "Sex" ? ["Female", "Male"][lv] : BMI_PLAIN[lv];
  const stats = G.levels.map((L) => {
    let tp = 0, fn = 0, fp = 0, tn = 0;
    L.pos.forEach((v, i) => (i >= k ? (tp += v) : (fn += v)));
    L.neg.forEach((v, i) => (i >= k ? (fp += v) : (tn += v)));
    return { L, tp, fn, fp, tn, miss: fn / Math.max(1, tp + fn), fpr: fp / Math.max(1, fp + tn) };
  });
  columns(document.getElementById("c-grp"), {
    cats: stats.map((s) => lab(s.L.level)), w: 860, h: 420, yMax: 1, yFmt: (v) => pct(v),
    series: [{ values: stats.map((s) => s.miss), color: "var(--pos)" }, { values: stats.map((s) => s.fpr), color: "var(--neg)" }],
    tip: (i) => { const s = stats[i]; return `<b>${lab(s.L.level)}</b> · ${fmt(s.L.n)} test adults<br>Has diabetes: ${fmt(s.tp + s.fn)}, of whom ${fmt(s.fn)} missed (${pct(s.miss, 1)})<br>No diabetes: ${fmt(s.fp + s.tn)}, of whom ${fmt(s.fp)} flagged (${pct(s.fpr, 1)})`; },
  });
});

add("Calibration", `
  <div class="kicker">Calibration</div><h1>Can we trust the risk percentage?</h1>
  <div class="row" style="gap:32px">
    <div class="col" style="flex:none;width:480px">
      <div class="controls" style="margin-bottom:4px"><div class="seg" id="cal-seg"><button data-v="raw">Before</button><button data-v="calibrated">After</button><button data-v="both">Both</button></div></div>
      <div class="legend" id="cal-legend"></div>
      <div id="c-cal"></div>
    </div>
    <div class="col" style="gap:12px">
      <div class="tile" style="flex:0;padding:10px 16px"><div class="label">Brier score: 0 is perfect, lower is better</div><div class="value" style="font-size:32px">${f3(calRaw.brier)} → ${f3(calCal.brier)}</div><div class="sub">before → after calibration</div></div>
      <div class="card sm"><h2>1 · What it measures</h2><p>How far each predicted % is from what really happened. Square each miss, then average over everyone.</p>
        <table class="mini"><tr><th>Person</th><th>Model said</th><th>Really</th><th>Miss²</th></tr>
          <tr><td>A</td><td>80%</td><td>Has diabetes (1)</td><td>(1 − 0.8)² = 0.04</td></tr>
          <tr><td>B</td><td>30%</td><td>Doesn't (0)</td><td>(0.3 − 0)² = 0.09</td></tr></table></div>
      <div class="card sm"><h2>2 · Why ours was off</h2><p>To catch more people with diabetes, training counted each of them about ${Math.round((1 - D.meta.prevalence) / D.meta.prevalence)}× as much. So the model overestimated everyone's %: the orange line sits below the dotted line.</p></div>
      <div class="card sm"><h2>3 · How we fixed it</h2><p>Calibration re-scales the %s to match the real rates seen in the training data. Who ranks highest doesn't change, only the % shown.</p></div>

  if (!state.cal) state.cal = "both";

  const mk = (c, color, name) => ({ x: c.mean_pred, y: c.frac_pos, color, markers: true,

  if (state.cal !== "raw") lines.push(mk(calCal, "var(--blue)", "After calibration"));

add("Explainability", `
  <div class="kicker">Explainability · SHAP on gradient boosting</div><h1>One person at a time</h1>
  <div class="row">
    <div class="col" style="flex:none;width:760px"><canvas id="c-shap" width="1520" height="1000" style="width:760px;height:500px"></canvas></div>
    <div class="col">
      <div class="legend" style="flex-direction:column;gap:6px"><span><i class="sw" style="background:var(--red)"></i>high value of that answer</span><span><i class="sw" style="background:var(--blue)"></i>low value</span></div>
      <p class="note">Each dot is one of <b>${fmt(D.shap.values.length)}</b> test adults. A dot to the right pushed that person <b>toward</b> diabetes.</p>
      <p class="note"><b>General health, blood pressure, age and BMI</b> move predictions the most. Fruit, vegetables, activity and smoking sit almost on zero.</p>
    </div>
  </div>`, () => {
  const sh = D.shap, F = sh.features, n = sh.values.length;
  const order = F.map((f, j) => j).sort((a, b) => sh.mean_abs[b] - sh.mean_abs[a]);
  const cv = document.getElementById("c-shap"), g = cv.getContext("2d");
  g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 760, 500);
  const ml = 190, mr = 14, mt = 4, rowH = 21.5, W = 760, iw = W - ml - mr;
  let mn = 0, mx = 0; sh.values.forEach((r) => r.forEach((v) => { mn = Math.min(mn, v); mx = Math.max(mx, v); }));
  const X = (v) => ml + (v - mn) / (mx - mn) * iw;
  const blue = [42, 120, 214], red = [227, 73, 72], mid = [200, 199, 193];
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const colorOf = (t) => (t < 0.5 ? mix(blue, mid, t * 2) : mix(mid, red, (t - 0.5) * 2));
  g.font = "14px system-ui, sans-serif"; g.textAlign = "right"; g.textBaseline = "middle";
  // zero line + ticks
  g.strokeStyle = "#e1e0d9"; g.lineWidth = 1;
  for (let t = Math.ceil(mn); t <= mx; t += 1) { g.beginPath(); g.moveTo(X(t), mt); g.lineTo(X(t), mt + F.length * rowH); g.stroke(); }
  g.strokeStyle = "#0b0b0b"; g.beginPath(); g.moveTo(X(0), mt); g.lineTo(X(0), mt + F.length * rowH); g.stroke();
  g.fillStyle = "#898781"; g.textAlign = "center"; g.font = "13px system-ui, sans-serif";
  for (let t = Math.ceil(mn); t <= mx; t += 1) g.fillText((t > 0 ? "+" : "") + t, X(t), mt + F.length * rowH + 14);
  g.fillText("← away from diabetes   ·   push on the model's score (log-odds)   ·   toward diabetes →", ml + iw / 2, mt + F.length * rowH + 32);
  let rng = 1; const rand = () => ((rng = (rng * 16807) % 2147483647) / 2147483647);
  const tips = [];
  order.forEach((j, r) => {
    const yc = mt + r * rowH + rowH / 2;
    g.fillStyle = "#52514e"; g.textAlign = "right"; g.font = "14px system-ui, sans-serif";
    g.fillText(qLabel(F[j]), ml - 12, yc);
    const col = sh.data.map((d) => d[j]).sort((p, q) => p - q);   // colour scale clipped to the 5th-95th percentile, like shap
    let lo = col[Math.floor(0.05 * (n - 1))], hi = col[Math.floor(0.95 * (n - 1))];
    if (hi <= lo) { lo = col[0]; hi = col[n - 1]; }

    sh.values.forEach((v) => bins[bi(v[j])]++);
    const bmax = Math.max(...bins);
    for (let i = 0; i < n; i++) {
      const v = sh.values[i][j], t = hi > lo ? Math.max(0, Math.min(1, (sh.data[i][j] - lo) / (hi - lo))) : 0.5;
      const amp = (rowH * 0.42) * Math.sqrt(bins[bi(v)] / bmax);
      const c = colorOf(t);

      g.beginPath(); g.arc(X(v), yc + (rand() * 2 - 1) * amp, 2.2, 0, 2 * Math.PI); g.fill();

  });
  // hover rows via an overlay of divs
  let ov = document.getElementById("shap-ov");
  if (!ov) { ov = document.createElement("div"); ov.id = "shap-ov"; ov.style.cssText = "position:absolute;left:0;top:0;width:760px;height:500px"; cv.parentNode.style.position = "relative"; cv.parentNode.appendChild(ov); }
  ov.innerHTML = tips.map((tp, r) => `<div data-tip="${esc(tp)}" style="position:absolute;left:0;width:760px;top:${mt + r * rowH}px;height:${rowH}px"></div>`).join("");
});

const live = { i: 0, x: null, orig: null, prev: null };
function loadCaller(i) {

  live.orig = L.callers[live.i].slice(0, FEAT.length);

}
function buildForm() {
  const order = ["GenHlth","Age","Sex","BMI","HighBP","HighChol","CholCheck","HeartDiseaseorAttack","Stroke","DiffWalk","MentHlth","PhysHlth",
    "PhysActivity","Smoker","Fruits","Veggies","HvyAlcoholConsump","Income","Education","AnyHealthcare","NoDocbcCost"];
  document.getElementById("qgrid").innerHTML = order.map((f) => {
    const j = FEAT.indexOf(f), q = Q[f], v = live.x[j], changed = v !== live.orig[j];
    const ctl = q.num ? `<input type="number" min="${q.num[0]}" max="${q.num[1]}" value="${v}" data-j="${j}">`
      : `<select data-j="${j}">${q.opts.map(([lab, code]) => `<option value="${code}" ${code === v ? "selected" : ""}>${lab}</option>`).join("")}</select>`;
    return `<div class="q ${changed ? "changed" : ""}"><label title="${esc(q.ask)}">${q.ask}</label>${ctl}</div>`;
  }).join("");
  document.querySelectorAll("#qgrid [data-j]").forEach((el) => {
    const on = () => {

      if (q.num) { if (!Number.isFinite(v)) return; v = Math.max(q.num[0], Math.min(q.num[1], v)); }
      live.prev = M.calibratedRisk(L.calibrated, live.x);
      live.x[j] = v; el.parentNode.classList.toggle("changed", v !== live.orig[j]); drawLive();
    };

}
function drawLive() {

    const first = L.callers.findIndex((c) => c[FEAT.length] === 1 && M.sigmoid(M.rawScore(L.gb, c.slice(0, FEAT.length))) >= L.threshold);
    loadCaller(Math.max(0, first)); return;
  }

  const edited = x.some((v, j) => v !== live.orig[j]), label = L.callers[live.i][FEAT.length];

    s += `<rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" data-tip="${esc(`<b>${r.name}</b>${r.ans ? ": " + r.ans : ""}<br>${up ? "Pushes toward" : "Pushes away from"} diabetes by ${Math.abs(r.v).toFixed(3)} (log-odds)`)}"/>`;
  });

  document.getElementById("waterfall").innerHTML = s + "</svg>";

function answerText(f, v) {

// ------------------------------------------------------------------ deck mechanics
const host = document.getElementById("slides");
host.innerHTML = S.map((s) => `<section class="slide">${s.html}</section>`).join("");
const slides = [...host.children].map((el, i) => ({ el, draw: S[i].draw, sec: S[i].sec }));
let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, j) => s.el.classList.toggle("active", j === cur));
  if (slides[cur].draw) slides[cur].draw();
  runCounts(slides[cur].el);
  document.getElementById("sec").textContent = slides[cur].sec;
  document.getElementById("num").textContent = `${cur + 1} / ${slides.length}`;
  document.getElementById("progress").style.width = (100 * (cur + 1) / slides.length) + "%";
  history.replaceState(null, "", "#" + (cur + 1));
  tip.style.display = "none";
}
document.getElementById("cl-next").onclick = () => loadCaller(live.i + 1);
document.getElementById("cl-pos").onclick = () => pickCaller(1);
document.getElementById("cl-neg").onclick = () => pickCaller(0);
document.getElementById("cl-reset").onclick = () => loadCaller(live.i);
if (D.rl) {
  // Each call picks a new respondent at random (the very first one is whoever the demo slide showed)
  let first = true;
  document.getElementById("rl-go").onclick = () => { if (!first) loadCaller(Math.floor(Math.random() * L.callers.length)); first = false; rlCall(); };
}

document.addEventListener("keydown", (e) => {
  document.getElementById("navhint").style.display = "none";
  const tag = (e.target.tagName || "").toLowerCase();
  if (["input", "select", "textarea"].includes(tag)) return;   // let form controls keep their arrow keys
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
// keep the stage centred: translate in unscaled units, then scale
function fit2() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720), st = document.getElementById("stage");
  st.style.left = (innerWidth - 1280 * s) / 2 + "px"; st.style.top = (innerHeight - 720 * s) / 2 + "px";
  st.style.transform = `scale(${s})`;
}
addEventListener("resize", fit2); fit2();
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
